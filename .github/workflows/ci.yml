name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the version agrees across every file that carries it
        run: node scripts/stamp-release.mjs --check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/soku-cli-pack.json
          node - <<'NODE'
          const fs = require('node:fs')
          const [pack] = JSON.parse(fs.readFileSync('/tmp/soku-cli-pack.json', 'utf8'))
          const files = new Set(pack.files.map((f) => f.path))
          for (const required of [
            'dist/index.js',
            'dist/generated/capabilities.json',
            // `soku changelog` reads this at runtime, so a package without it
            // ships a command that fails on every invocation.
            'dist/generated/changelog.json',
            'skills/soku/SKILL.md',
            'package.json',
          ]) {
            if (!files.has(required)) {
              throw new Error(`npm pack is missing ${required}`)
            }
          }
          console.log(`Packed ${pack.name}@${pack.version} with ${pack.files.length} files`)
          NODE

  # Every push to main whose package.json version has no tag yet gets one, and
  # that tag is what publishes to npm. A tag pushed with GITHUB_TOKEN does not
  # fire `on: push: tags` (GitHub blocks workflow recursion), so publish.yml is
  # dispatched explicitly on the new tag instead.
  tag-release:
    name: Tag release
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Tag the version and dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="soku-ai-cli-v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run publish.yml --ref "$TAG" -f dry_run=false
          echo "tagged $TAG and dispatched publish"
